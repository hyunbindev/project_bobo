name: App CI / CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'observability/**'
      - 'compose.observability.yaml'
      - '.github/workflows/deploy-observability.yml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'observability/**'
      - 'compose.observability.yaml'
      - '.github/workflows/deploy-observability.yml'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bobo_test
          POSTGRES_USER: bobo_test
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U bobo_test -d bobo_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://bobo_test:ci-test-password@127.0.0.1:5432/bobo_test
      TEST_DATABASE_URL: postgresql://bobo_test:ci-test-password@127.0.0.1:5432/bobo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run db:migration-check
      - name: Validate combined Compose configuration
        run: |
          sed 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=ci-placeholder/' .env.production.example > .env.production
          for script in scripts/compose.sh scripts/deploy.sh; do bash -n "$script"; done
          bash scripts/compose.sh config --quiet

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Serialize deployments to the same production project.
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/project-bobo' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER secret}"
          : "${SSHPASS:?Set the DEPLOY_PASSWORD secret}"

          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          # Deploy the validated SHA without overwriting local tracked changes.
          git diff --quiet
          git diff --cached --quiet
          git fetch origin master
          git merge-base --is-ancestor "$2" origin/master
          git checkout --detach "$2"
          bash scripts/deploy.sh app
          REMOTE_SCRIPT
